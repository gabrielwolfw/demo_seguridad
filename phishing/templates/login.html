<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BancoDemo — Iniciar sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px; width: 380px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon {
      width: 40px; height: 40px; background: #1a56db;
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: bold; font-size: 18px;
    }
    .logo-text { font-size: 20px; font-weight: 700; color: #1a202c; }
    .logo-sub { font-size: 11px; color: #6b7280; }
    h2 { font-size: 22px; color: #1a202c; margin-bottom: 6px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px; font-size: 14px;
      margin-bottom: 16px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1a56db; }
    .totp-hint { font-size: 12px; color: #9ca3af; margin-top: -12px; margin-bottom: 16px; }
    button {
      width: 100%; padding: 12px;
      background: #1a56db; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1e429f; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #ecfdf5; color: #059669;
      border-radius: 20px; padding: 4px 10px;
      font-size: 12px; font-weight: 600; margin-bottom: 20px;
    }
    .badge::before { content: "🔒"; }
    .error {
      background: #fef2f2; border: 1px solid #fca5a5;
      color: #dc2626; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">B</div>
      <div>
        <div class="logo-text">BancoDemo</div>
        <div class="logo-sub">Banca en línea segura</div>
      </div>
    </div>

    <span class="badge">Sitio verificado — banco-demo.com</span>

    <h2>Iniciar sesión</h2>
    <p class="subtitle">Ingresa tus credenciales y tu código de autenticación.</p>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label>Usuario</label>
      <input type="text" name="username" placeholder="tu usuario" autocomplete="off" required>

      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>

      <label>Código TOTP (6 dígitos)</label>
      <input type="text" name="totp_code" placeholder="123456" maxlength="6" autocomplete="off" required>
      <p class="totp-hint">Abre tu app autenticadora y escribe el código actual.</p>

      <button type="submit">Ingresar</button>
    </form>

    <div class="footer">© 2026 BancoDemo. Todos los derechos reservados.</div>
  </div>
</body>
</html>
