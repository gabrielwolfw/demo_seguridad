<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BancoDemo — Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
    .navbar {
      background: #1a56db; color: white;
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar .brand { font-size: 20px; font-weight: 700; }
    .navbar .user { font-size: 14px; opacity: 0.85; }
    .logout { color: white; text-decoration: none; font-size: 13px;
      background: rgba(255,255,255,0.2); padding: 6px 14px;
      border-radius: 6px; margin-left: 16px; }
    .container { max-width: 700px; margin: 48px auto; padding: 0 20px; }
    .success-banner {
      background: #ecfdf5; border: 1.5px solid #6ee7b7;
      border-radius: 12px; padding: 24px 28px;
      display: flex; align-items: flex-start; gap: 16px;
      margin-bottom: 28px;
    }
    .success-icon { font-size: 32px; }
    .success-title { font-size: 18px; font-weight: 700; color: #065f46; margin-bottom: 4px; }
    .success-sub { font-size: 14px; color: #047857; }
    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px;
    }
    .balance-label { font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .balance { font-size: 36px; font-weight: 800; color: #1a202c; }
    .balance span { font-size: 18px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand">🏦 BancoDemo</div>
    <div style="display:flex;align-items:center">
      <div class="user">Bienvenido, {{ username }}</div>
      <a href="/logout" class="logout">Cerrar sesión</a>
    </div>
  </div>
  <div class="container">
    <div class="success-banner">
      <div class="success-icon">✅</div>
      <div>
        <div class="success-title">Autenticación exitosa</div>
        <div class="success-sub">Usuario <strong>{{ username }}</strong> autenticado con TOTP. Sesión iniciada correctamente.</div>
      </div>
    </div>
    <div class="card">
      <div class="balance-label">Saldo disponible</div>
      <div class="balance">₡ 4,250,000 <span>CRC</span></div>
    </div>
  </div>
</body>
</html>
